<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Let's make your data trustworthy"><title>Let's make your data trustworthy</title><style>@font-face{font-family:IA;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:ID;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:IA;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.b1{animation:d1 22s ease-in-out infinite}.b2{animation:d2 26s ease-in-out infinite}.b3{animation:d3 30s ease-in-out infinite}@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,40px)}}@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,-30px)}}@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-50px)}}</style><defs><clipPath id="clip"><rect x="0.5" y="0.5" width="999" height="299" rx="24"/></clipPath><filter id="blur" filterUnits="userSpaceOnUse" x="-400" y="-400" width="1800" height="1100"><feGaussianBlur stdDeviation="70"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern><radialGradient id="fade" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="gm"><rect width="1000" height="300" fill="url(#fade)"/></mask><linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0"><stop offset="0" stop-color="rgba(255,255,255,0)"/><stop offset="0.5" stop-color="rgba(255,255,255,0.28)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient><linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="670" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f0abfc"/></linearGradient></defs><g clip-path="url(#clip)"><rect width="1000" height="300" fill="#0a0a10"/><g filter="url(#blur)"><circle class="b1" cx="250" cy="300" r="200" fill="#7c3aed" opacity="0.45"/><circle class="b2" cx="750" cy="0" r="190" fill="#db2777" opacity="0.35"/><circle class="b3" cx="520" cy="340" r="150" fill="#2563eb" opacity="0.3"/></g><rect width="1000" height="300" fill="url(#grid)" mask="url(#gm)"/><rect x="0.5" y="0.5" width="999" height="299" rx="24" fill="none" stroke="rgba(255,255,255,0.09)"/><line x1="80" y1="0.75" x2="920" y2="0.75" stroke="url(#g1)" stroke-width="1.2"/></g><text x="500.0" y="84.0" font-family="IA, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6e6e82" letter-spacing="1.8" text-anchor="middle" >06  ·  CONTACT</text><text x="500.0" y="148.0" font-family="ID, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="600" fill="#f4f4f8" letter-spacing="-1.6" text-anchor="middle" >Let’s make your data</text><text x="500.0" y="200.0" font-family="ID, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="600" fill="url(#g2)" letter-spacing="-1.6" text-anchor="middle" >trustworthy.</text><text x="500.0" y="248.0" font-family="IA, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="400" fill="#a3a3b5" letter-spacing="0" text-anchor="middle" >Unreliable tracking, reports that disagree, or hours lost to manual work? I’d love to hear about it.</text></svg>